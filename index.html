<style>
/* =========================================================================
   DESIGN TOKENS  (light theme only)
   ========================================================================= */
:root{
  --bg:#f3f5fb; --ink:#1e1b4b; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e7eaf3; --line-2:#f1f3f9; --card:#ffffff;
  --g-brand:linear-gradient(120deg,#4f46e5 0%,#7c3aed 48%,#db2777 100%);
  /* status colours */
  --late:#e11d48;  --late-bg:#ffe4e6;
  --risk:#ea580c;  --risk-bg:#ffedd5;
  --soon:#d97706;  --soon-bg:#fef3c7;
  --prog:#2563eb;  --prog-bg:#dbeafe;
  --plan:#6366f1;  --plan-bg:#e0e7ff;
  --after:#7c3aed; --after-bg:#ede9fe;
  --done:#059669;  --done-bg:#d1fae5;
  --none:#64748b;  --none-bg:#f1f5f9;
  --na:#94a3b8;    --na-bg:#f8fafc;
  /* the two targets */
  --scml:#db2777; --scml-bg:#fce7f3;
  --ampl:#0284c7; --ampl-bg:#e0f2fe;
  --shadow-1:0 1px 2px rgba(30,27,75,.04),0 4px 14px -4px rgba(30,27,75,.08);
  --shadow-2:0 2px 4px rgba(30,27,75,.05),0 18px 40px -12px rgba(79,70,229,.25);
  --radius:18px;
  --left:520px; --row:56px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:
    radial-gradient(900px 500px at 0% -10%,rgba(124,58,237,.10),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(219,39,119,.08),transparent 60%),
    radial-gradient(900px 700px at 50% 110%,rgba(20,184,166,.07),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* ---------- hero ---------- */
.hero{background:var(--g-brand);color:#fff;padding:22px 0 0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 85% 0%,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero-top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
h1{margin:2px 0 0;font-size:clamp(20px,2.8vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.subtitle{margin:4px 0 0;opacity:.88;font-size:13.5px;font-weight:500}
.sync{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3);animation:pulse 2s infinite}
.dot.warn{background:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,.3)}
.dot.err{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.3);animation:none}
.dot.demo{background:#e2e8f0;box-shadow:0 0 0 3px rgba(226,232,240,.3);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.26)}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;gap:6px;margin-top:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:10px 14px 11px;border-radius:12px 12px 0 0;font-weight:700;font-size:13px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:7px;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.nav a.on{background:var(--bg);color:var(--ink)}
.nav .sep{width:1px;background:rgba(255,255,255,.3);margin:8px 6px;flex:none}
.nav .cnt{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--late);color:#fff}
.nav a.on .cnt{background:var(--late)}

main{padding:22px 0 30px}
.demo-note{margin:16px auto 0;max-width:1460px;background:#fffbeb;border:1px solid #fde68a;color:#78350f;padding:10px 14px;border-radius:12px;font-size:13px}
.demo-note code{font-family:var(--mono);font-size:12px;background:#fef3c7;padding:1px 5px;border-radius:5px}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sec-title h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec-title p{margin:0;color:var(--ink-2);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.4}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.s-late{color:var(--late);background:var(--late-bg)} .s-risk{color:var(--risk);background:var(--risk-bg)}
.s-soon{color:var(--soon);background:var(--soon-bg)} .s-prog{color:var(--prog);background:var(--prog-bg)}
.s-plan{color:var(--plan);background:var(--plan-bg)} .s-after{color:var(--after);background:var(--after-bg)}
.s-done{color:var(--done);background:var(--done-bg)} .s-none{color:var(--none);background:var(--none-bg)}
.s-na{color:var(--na);background:var(--na-bg);box-shadow:inset 0 0 0 1px #e2e8f0}
.tag-scml{color:var(--scml);background:var(--scml-bg)} .tag-ampl{color:var(--ampl);background:var(--ampl-bg)}
.seg{display:inline-flex;background:#eef0f7;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(30,27,75,.12)}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl label.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:0 10px;height:36px;min-width:220px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{accent-color:#6d28d9;width:16px;height:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c7cbe0}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty b{color:var(--ink)}

/* ---------- legend ---------- */
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;padding:12px 16px;font-size:12px;color:var(--ink-2);font-weight:600}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.legend .div{width:1px;height:20px;background:var(--line)}
.mk{display:inline-block;flex:none}
.mk.scml{width:11px;height:11px;background:var(--scml);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--scml)}
.mk.ampl{width:11px;height:11px;background:var(--ampl);border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ampl)}
.mk.win{width:26px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--ampl),var(--scml));opacity:.45}
.mk.hatchsw{width:26px;height:10px;border-radius:4px;background:repeating-linear-gradient(135deg,#c4b5fd 0 4px,#ede9fe 4px 8px)}
.mk.today{width:2px;height:16px;background:var(--late);border-radius:1px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;position:relative;overflow:hidden;cursor:default}
.kpi.click{cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.kpi .k-l{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.kpi .k-v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.kpi .k-s{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,#6366f1)}

/* ---------- persons + village cards ---------- */
.person{margin-top:14px;padding:16px}
.p-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none;letter-spacing:.02em}
.p-name{font-weight:800;font-size:16px;line-height:1.2}
.p-sub{font-size:12.5px;color:var(--ink-2);font-weight:600}
.p-chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.vcard{display:block;border:1px solid var(--line);border-radius:15px;padding:14px 15px;background:linear-gradient(180deg,#fff,#fbfbfe);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.vcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:#d6d3f5}
.vc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.vc-name{font-weight:800;font-size:17px;letter-spacing:-.01em}
.vc-sub{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:1px}
.ring{width:52px;height:52px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.segbar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:#eef0f7;margin:12px 0 9px;gap:1px}
.segbar span{display:block;height:100%}
.vc-chips{display:flex;gap:5px;flex-wrap:wrap}
.vc-next{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-2)}
.vc-next .lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);display:block;margin-bottom:2px}
.vc-next b{color:var(--ink)}
.vc-phase{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:6px;color:var(--ink-2);font-weight:600}
.vc-empty{margin-top:12px;font-size:12.5px;color:var(--none);background:var(--none-bg);border-radius:10px;padding:9px 11px}
.go{position:absolute;right:14px;bottom:13px;color:var(--ink-3)}

/* ---------- tables (action list, compare) ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tabs button.on{border-color:transparent;box-shadow:0 0 0 2px currentColor inset}
.tabs button b{font-size:11px;background:currentColor;border-radius:999px;padding:0 6px;line-height:17px}
.tabs button b span{color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfe;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f8f7ff}
.tbl .dcell{white-space:nowrap;font-weight:700}
.tbl .dcell small{display:block;font-weight:600;font-size:11.5px}
.tbl-wrap{overflow-x:auto}

/* ---------- matrix ---------- */
.mx-wrap{overflow:auto;max-height:calc(100vh - 230px);border-radius:0 0 var(--radius) var(--radius)}
.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.mx thead th{position:sticky;background:#fff;z-index:2;padding:7px 6px;font-weight:800;text-align:center}
.mx thead tr:nth-child(1) th{top:0;height:52px}
.mx thead tr:nth-child(2) th{top:52px;height:28px;font-size:11px}
.mx thead tr:nth-child(3) th{top:80px;height:26px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.mx .vh{color:#fff;font-size:13px;line-height:1.15}
.mx .vh a{display:block}
.mx .vh small{display:block;font-weight:600;font-size:10.5px;opacity:.9;margin-top:2px}
.mx .ph{background:#f5f3ff;color:#5b21b6}
.mx .rs{background:var(--scml-bg);color:var(--scml)} .mx .ra{background:var(--ampl-bg);color:var(--ampl)}
.mx .stk{position:sticky;left:0;z-index:1;background:#fff}
.mx thead .stk{z-index:3}
.mx td.an{min-width:300px;max-width:360px;padding:8px 10px;font-weight:600;line-height:1.3}
.mx td.an .sl{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;background:#eef0f7;font-size:11px;font-weight:800;margin-right:8px;float:left}
.mx td.c{padding:4px;text-align:center;min-width:84px;cursor:pointer}
.mx td.c span{display:block;border-radius:7px;padding:6px 4px;font-weight:700;white-space:nowrap;font-size:11.5px}
.mx td.c:hover span{box-shadow:0 0 0 2px #a5b4fc}
.mx tbody tr:hover td{background:#fbfaff}
.mx tbody tr:hover td.stk{background:#f6f5ff}
.mx td.vs,.mx th.vs{border-left:2px solid #c7cbe0}
.mx td.c .d-late{color:#9f1239;background:var(--late-bg)}
.mx td.c .d-soon{color:#92400e;background:var(--soon-bg)}
.mx td.c .d-plan{color:#3730a3;background:#eef2ff}
.mx td.c .d-done{color:#065f46;background:var(--done-bg)}
.mx td.c .d-na{color:#a3acbb;background:transparent;font-weight:600}
.mx td.c .d-after{color:#5b21b6;background:var(--after-bg)}
.mx td.c .d-prog{color:#1e40af;background:var(--prog-bg)}
.mx td.c .d-none{color:#94a3b8;background:repeating-linear-gradient(135deg,#f8fafc 0 5px,#f1f5f9 5px 10px)}
.mx td.c .d-note{color:#334155;background:#f1f5f9}
.mx .flash span{animation:flash 2.4s ease}

/* ---------- village head ---------- */
.vhead{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.vh-name{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.vh-person{display:flex;align-items:center;gap:10px;margin-top:8px}
.vh-person .avatar{width:34px;height:34px;border-radius:10px;font-size:12px}
.vh-person .who{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.vh-person .nm{font-weight:800;font-size:14.5px}
.vh-desc{color:var(--ink-2);font-size:12.5px;margin-top:6px}
.vh-prog{text-align:right;min-width:200px}
.vh-prog .big{font-size:30px;font-weight:800;line-height:1}
.vh-prog .small{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:4px}
.vh-prog .segbar{width:220px;margin:10px 0 0 auto}
.fchips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchips .chip{cursor:pointer;border:0;padding:5px 11px;font-size:12px;transition:transform .1s,box-shadow .1s}
.fchips .chip:hover{transform:translateY(-1px)}
.fchips .chip.on{box-shadow:0 0 0 2px currentColor}
.fchips .chip.off{opacity:.38}
.fchips .clear{font-size:12px;font-weight:700;color:var(--plan);background:none;border:0;cursor:pointer}
.toolbar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}
.toolbar .grow{flex:1}

/* ---------- gantt ---------- */
.gantt-card{overflow:hidden}
.gantt{overflow:auto;max-height:calc(100vh - 170px);position:relative;overscroll-behavior:contain}
.g-inner{position:relative;min-width:100%}
.g-head{display:flex;position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line)}
.g-head .g-left{display:flex;align-items:flex-end;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:0 0 8px;background:#fff;z-index:7}
.g-left{position:sticky;left:0;width:var(--left);flex:none;background:#fff;z-index:4;border-right:1px solid var(--line);display:grid;grid-template-columns:40px minmax(0,1fr) 92px 92px;align-items:center}
.g-head .g-left > div{padding:0 8px}
.g-scale{position:relative;height:58px;flex:none}
.g-month{position:absolute;top:0;height:30px;border-left:1px solid var(--line);padding:7px 8px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;color:var(--ink)}
.g-month.alt{background:#fafbfe}
.g-tick{position:absolute;top:32px;font-size:10.5px;color:var(--ink-3);font-weight:700;transform:translateX(-50%);font-family:var(--mono)}
.g-today-lbl{position:absolute;top:31px;transform:translateX(-50%);background:var(--late);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap;z-index:2}
.g-overlay{position:absolute;top:58px;bottom:0;pointer-events:none;z-index:0}
.g-vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.g-vl.m{background:var(--line)}
.g-todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--late);opacity:.75}
.g-row{display:flex;height:var(--row);border-bottom:1px solid var(--line-2);position:relative;cursor:pointer}
.g-row:hover .g-left,.g-row:hover .g-track{background-color:#f8f7ff}
.g-row.sel .g-left,.g-row.sel .g-track{background-color:#f1efff}
.g-row.first-of-act{border-top:1px solid var(--line)}
.g-row .g-left{border-left:4px solid var(--rc,#cbd5e1)}
.g-row .sl{display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2)}
.g-row .nm{min-width:0;padding:0 8px}
.g-row .nm .t{font-weight:700;font-size:12.8px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-row .nm .m{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.g-row .nm .m .chip{font-size:10.5px;padding:1px 7px}
.g-row .dt{padding:0 6px;font-size:12px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.g-row .dt small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.g-row .dt.late{color:var(--late)} .g-row .dt.soon{color:var(--soon)} .g-row .dt.done{color:var(--done)}
.g-row .dt.na{color:var(--na);font-weight:600} .g-row .dt.after{color:var(--after)} .g-row .dt.prog{color:var(--prog)} .g-row .dt.none{color:var(--ink-3);font-weight:600}
.g-track{position:relative;flex:none;z-index:1}
.g-row.na .g-track,.g-row.na .g-left{opacity:.55}
.g-row.flash .g-left,.g-row.flash .g-track{animation:flash 2.4s ease}
@keyframes flash{0%,40%{background-color:#fef9c3}100%{background-color:transparent}}
.bar{position:absolute;top:calc(50% - 4px);height:8px;border-radius:5px;opacity:.5}
.bar.dash{background:repeating-linear-gradient(90deg,var(--bc) 0 6px,transparent 6px 10px)!important;opacity:.6}
.hatch{position:absolute;top:calc(50% - 9px);height:18px;border-radius:6px;background:repeating-linear-gradient(135deg,#c4b5fd 0 5px,#ede9fe 5px 10px);display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:800;color:#5b21b6;white-space:nowrap;overflow:hidden;box-shadow:inset 0 0 0 1px #c4b5fd}
.mark{position:absolute;top:50%;z-index:2}
.mark.scml{width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--scml);transform:rotate(45deg);border-radius:3px;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(219,39,119,.4)}
.mark.ampl{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:var(--ampl);border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(2,132,199,.4)}
.mark.late.scml{background:var(--late)}
.glabel{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink-2);display:flex;gap:8px;align-items:center;z-index:2;pointer-events:none;background:rgba(255,255,255,.88);padding:2px 7px;border-radius:7px}
.glabel .p{display:inline-flex;gap:4px;align-items:center}
.glabel .p b{font-weight:800}
.glabel .p.s b{color:var(--scml)} .glabel .p.a b{color:var(--ampl)}
.tchip{position:absolute;top:50%;transform:translateY(-50%);z-index:2}
.progbar{position:absolute;top:calc(50% - 5px);height:10px;border-radius:5px;background:repeating-linear-gradient(135deg,#93c5fd 0 5px,#dbeafe 5px 10px);box-shadow:inset 0 0 0 1px #93c5fd}
.g-empty{position:absolute;left:var(--left);right:0;top:58px;padding:40px;text-align:center;color:var(--ink-2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,27,75,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;transform:translateX(102%);transition:transform .25s ease;box-shadow:-20px 0 50px -20px rgba(30,27,75,.35);display:flex;flex-direction:column}
.panel.show{transform:none}
.pn-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative}
.pn-head .x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center}
.pn-eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.pn-title{font-size:18px;font-weight:800;line-height:1.3;margin:4px 40px 8px 0}
.pn-body{padding:16px 20px 30px;overflow:auto;flex:1}
.pn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbox{border-radius:14px;padding:12px 13px;border:1px solid var(--line)}
.tbox.s{background:linear-gradient(180deg,#fff,var(--scml-bg))} .tbox.a{background:linear-gradient(180deg,#fff,var(--ampl-bg))}
.tbox .h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.tbox.s .h{color:var(--scml)} .tbox.a .h{color:var(--ampl)}
.tbox .v{font-size:17px;font-weight:800;margin-top:6px;line-height:1.2}
.tbox .r{font-size:12.5px;font-weight:700;margin-top:3px}
.tbox .ref{font-size:11px;color:var(--ink-3);margin-top:6px;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px;margin:14px 0}
.kv dt{color:var(--ink-3);font-weight:700;font-size:12px}
.kv dd{margin:0;font-weight:600}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.pn-body h4{margin:22px 0 8px;font-size:13px;font-weight:800}
.cmp td,.cmp th{padding:8px 8px}
.cmp tr.me td{background:#f5f3ff;font-weight:700}

/* ---------- remarks ---------- */
.rmc{color:#9d174d;background:#fdf2f8;box-shadow:inset 0 0 0 1px #fbcfe8}
.rmc svg{flex:none}
.rm-form{border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(180deg,#fff,#faf9ff)}
.rm-form textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:13px;outline:0;background:#fff}
.rm-form textarea:focus,.rm-form input:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.rm-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.rm-row input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:0}
.rm-row .cc{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.btn.primary{background:var(--g-brand);color:#fff;border:0}
.btn.primary:disabled{opacity:.55;cursor:default}
.rm-hint{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.rm-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rm{border:1px solid var(--line);border-left:3px solid #ec4899;border-radius:10px;padding:9px 11px;background:#fff}
.rm-h{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-3);font-weight:600}
.rm-h b{color:var(--ink);font-weight:800}
.rm-h .del{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:11.5px;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:6px}
.rm-h .del:hover{color:var(--late);background:var(--late-bg)}
.rm-h .del.armed{color:#fff;background:var(--late)}
.rm-t{white-space:pre-wrap;font-size:13px;margin-top:4px;overflow-wrap:anywhere}
.rm-snip{font-size:11.5px;color:#9d174d;font-weight:600;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recent{display:flex;flex-direction:column}
.recent .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.recent .it:last-child{border-bottom:0}
.recent .it:hover{background:#fbfaff}
.recent .wh{font-size:12px;color:var(--ink-2);font-weight:700}
.recent .wh b{color:var(--ink)}
.recent .tx{grid-column:1/-1;white-space:pre-wrap;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.recent .by{font-size:11.5px;color:var(--ink-3);font-weight:700;text-align:right;white-space:nowrap}
.mx td.c.has-rm{position:relative}
.mx td.c.has-rm:after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#ec4899;box-shadow:0 0 0 2px #fff}
.tip .trm{margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.18);color:#fbcfe8;white-space:pre-wrap}

/* ---------- tooltip / toast / footer ---------- */
.tip{position:fixed;z-index:60;background:#1e1b4b;color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;max-width:340px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.tip.show{opacity:1}
.tip .tt{font-weight:800;font-size:12.5px;margin-bottom:6px;line-height:1.3}
.tip .tr{display:flex;gap:8px;align-items:center;margin-top:3px}
.tip .tr .k{width:46px;font-weight:800;font-size:10.5px;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:#1e1b4b;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;transition:all .25s;z-index:70;box-shadow:var(--shadow-2);max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--ink-3);font-size:12px;text-align:center;padding:10px 20px 30px}
.warnbox{margin-top:14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 14px;font-size:12.5px}
.warnbox ul{margin:6px 0 0;padding-left:18px}

/* ---------- responsive ---------- */
@media (max-width:1100px){ :root{--left:400px} .g-left{grid-template-columns:34px minmax(0,1fr) 80px 80px} }
@media (max-width:760px){
  :root{--left:200px;--row:60px}
  .wrap{padding:0 14px}
  .g-left{grid-template-columns:28px minmax(0,1fr)}
  .g-left .dt,.g-head .g-left .hd{display:none}
  .g-row .nm .t{font-size:12px}
  .vhead{grid-template-columns:1fr}
  .vh-prog{text-align:left}
  .vh-prog .segbar{margin-left:0;width:100%}
  .search{min-width:0;flex:1}
  .pn-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:100px 1fr}
  .vcards{grid-template-columns:1fr}
  .p-chips{margin-left:0}
  .mx td.an{min-width:190px}
  .legend{padding:10px 12px}
  .legend .div{display:none}
}

/* ---------- snapshot (village images: overdue + due today) ---------- */
.snap-ov{position:fixed;inset:0;background:rgba(30,27,75,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto}
.snap-ov.show{display:flex}
.snap-box{background:#fff;border-radius:20px;width:min(1100px,100%);box-shadow:0 30px 80px -20px rgba(0,0,0,.45);overflow:hidden}
.snap-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#faf9ff)}
.snap-hd h3{margin:0;font-size:17px;font-weight:800}
.snap-hd p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.snap-hd .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.snap-ctl{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:flex-end;padding:14px 20px;border-bottom:1px solid var(--line)}
.snap-ctl .f{display:flex;flex-direction:column;gap:5px}
.snap-ctl .f > span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.snap-ctl select,.snap-ctl input[type=date]{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:13px;background:#fff;min-width:170px}
.snap-ctl .grow{flex:1}
.snap-info{padding:10px 20px 0;font-size:12.5px;color:var(--ink-2)}
.snap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px 20px 22px}
.snap-fig{margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#f8fafc;display:flex;flex-direction:column}
.snap-fig img{width:100%;display:block;cursor:zoom-in;background:#fff}
.snap-fig figcaption{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:#fff;flex-wrap:wrap}
.snap-fig figcaption b{font-size:13.5px}
.snap-fig figcaption .sp{flex:1}
.snap-fig figcaption .btn{padding:6px 10px;font-size:12px}
.snap-zoom{position:fixed;inset:0;z-index:90;background:rgba(15,13,40,.85);display:none;overflow:auto;padding:20px;cursor:zoom-out}
.snap-zoom.show{display:block}
.snap-zoom img{display:block;margin:0 auto;max-width:min(1080px,100%);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

const DAY = 864e5;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const dnum = iso => { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };

const fmtLong = n => { const d = dobj(n); return WD[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };

  na:    { label: 'Not applicable',     hint: 'Marked NA — this activity does not apply here.' }
};
const ORDER = ['late','risk','soon','prog','plan','after','done','none','na'];
const SCOLOR = { late:'#e11d48', risk:'#ea580c', soon:'#d97706', prog:'#2563eb', plan:'#6366f1', after:'#a78bfa', done:'#059669', none:'#cbd5e1', na:'#e2e8f0' };

/** State of one cell. */
function cst(c){
  if (!c) return 'none';
  switch (c.k) {
    case 'done': return 'done';
    case 'na': return 'na';
    case 'progress': return 'prog';
    case 'after': return 'after';
    case 'blank': return 'none';
    case 'date': { const x = dnum(c.d) - TODAY; return x < 0 ? 'late' : x <= DUE_DAYS ? 'soon' : 'plan'; }
    default: return 'note';
  }
}
/** Overall status of one activity line from its SCML (s) and AMPL (a) cells. */
function lineStatus(s, a){
  const S = cst(s), A = cst(a);
  const empty = x => x === 'na' || x === 'none';
  if (empty(S) && empty(A)) return (S === 'na' || A === 'na') ? 'na' : 'none';
  if (S === 'done') return 'done';
  if (A === 'done' && empty(S)) return 'done';
  if (S === 'prog' || A === 'prog') return 'prog';
  if (S === 'late') return 'late';
  if (A === 'late') return 'risk';
  if (S === 'soon' || A === 'soon') return 'soon';
  if (S === 'plan' || A === 'plan' || S === 'note' || A === 'note') return 'plan';
  if (S === 'after' || A === 'after') return 'after';
  if (A === 'done') return 'prog';
  return 'none';
}
/** Short text for a cell (used in tables, labels, matrix). */
function cellText(c, long){
  switch (c && c.k) {
    case 'date': return (long ? fmtLong(dnum(c.d)) : fmtD(dnum(c.d))) + (c.n ? ' · ' + c.n : '');
    case 'done': return 'Completed';
    case 'na': return 'NA';
    case 'after': return c.t || AFTER_LABEL;
    case 'progress': return long ? c.t : 'In process';
    case 'blank': return long ? 'Not entered yet' : '—';
    default: return c ? c.t : '—';
  }
}
const chip = (st, txt) => `<span class="chip s-${st}"><i></i>${esc(txt || ST[st].label)}</span>`;

/* =========================================================================
   DATA → MODEL
   ========================================================================= */
let DATA = null, VERSION = null, CHANGED_AT = null, LAST_SYNC = null, syncState = 'demo';
let V = [];            // villages
let LINES = [];        // every activity × village × phase
let SIG = new Map();   // line id -> signature, to spot changes
const IS_DEMO_ONLY = () => !API;

function buildModel(d){
  DUE_DAYS = Math.max(1, Number(d.settings && d.settings.DUE_SOON_DAYS) || 30);
  ST.soon.label = 'Due ≤ ' + DUE_DAYS + ' days';
  ST.soon.hint = 'A target date falls within the next ' + DUE_DAYS + ' days.';
  ST.plan.hint = 'Target dates are set and more than ' + DUE_DAYS + ' days away.';
  // "After …" label = most common after-text in the sheet
  const cnt = {};
  d.villages.forEach(v => v.tracks.forEach(t => t.cells.forEach(c => ['s','a'].forEach(r => { if (c[r].k === 'after') cnt[c[r].t] = (cnt[c[r].t] || 0) + 1; }))));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  AFTER_LABEL = top ? top[0] : 'After 01-Apr-27';
  ST.after.label = AFTER_LABEL;
  ST.after.hint = 'Deferred: planned ' + AFTER_LABEL.replace(/^after/i, 'after') + '.';

  V = d.villages.map((v, i) => ({ ...v, idx: i, color: V_COLS[i % V_COLS.length] }));
  LINES = [];
  V.forEach(v => v.tracks.forEach((t, ti) => t.cells.forEach((c, ai) => {
    const id = v.key + '|' + ti + '|' + ai;
    LINES.push({ id, v, t, ti, ai, act: d.activities[ai], s: c.s, a: c.a, st: lineStatus(c.s, c.a), rm: (d.remarks && d.remarks[id]) || [] });
  })));
}
function refreshStatuses(){ LINES.forEach(L => L.st = lineStatus(L.s, L.a)); }
const sigOf = L => (L.s.t || '') + '¦' + (L.a.t || '') + '¦' + L.act.name + '¦' + L.rm.map(r => r.id).join(',');
const linesOf = (vkey, ti) => LINES.filter(L => L.v.key === vkey && (ti == null || ti === 'all' || L.ti === Number(ti)));
function counts(lines){ const c = {}; ORDER.forEach(k => c[k] = 0); lines.forEach(L => c[L.st]++); return c; }
const trackName = (v, t) => v.name + (t.phase ? ' · ' + t.phase : '');
/** The date that matters next for a line (earliest open target). */
function nextDate(L){
  const ds = [L.s, L.a].filter(c => c.k === 'date').map(c => dnum(c.d));
  return ds.length ? Math.min(...ds) : null;
}
function personsOf(){
  const m = new Map();
  V.forEach(v => { const p = v.person || 'Not assigned'; if (!m.has(p)) m.set(p, []); m.get(p).push(v); });
  return [...m.entries()].map(([name, villages], i) => ({ name, villages, grad: P_GRADS[i % P_GRADS.length] }));
}
const personGrad = name => { const ps = personsOf(); const p = ps.find(x => x.name === (name || 'Not assigned')); return p ? p.grad : P_GRADS[0]; };

/* =========================================================================
   UI STATE + ROUTING
   #/                 overview (by responsible person)
   #/glance           all villages at a glance (matrix, like the Excel)
   #/v/<village>      village Gantt
   ========================================================================= */
const UI = { view: 'overview', vkey: null, phase: 'all', q: '', statuses: new Set(), showNA: false, marks: 'both', zoom: CONFIG.DEFAULT_ZOOM,
             listTab: null, mxRole: 'both', mxPerson: '', mxQ: '', sel: null, pendingOpen: null, flash: new Set(),
             onlyRm: false, drafts: {}, saving: false };

function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  if (/^glance/i.test(h)) return { view: 'matrix' };
  const m = h.match(/^v\/([^/?#]+)/i);
  if (m) return { view: 'village', vkey: decodeURIComponent(m[1]).toLowerCase() };
  return { view: 'overview' };
}
function route(){
  if (!DATA) return;
  const r = parseRoute();
  if (r.view === 'village' && !V.some(v => v.key === r.vkey)) { history.replaceState(null, '', '#/'); r.view = 'overview'; }
  if (r.view === 'village' && r.vkey !== UI.vkey) { UI.phase = 'all'; UI.q = ''; UI.statuses.clear(); UI.showNA = false; UI.onlyRm = false; }
  UI.view = r.view; UI.vkey = r.view === 'village' ? r.vkey : null;
  closePanel(); hideTip();
  render(true);
  window.scrollTo({ top: 0 });
}
function go(hash, open){ UI.pendingOpen = open || null; if (location.hash === hash) route(); else location.hash = hash; }

/* =========================================================================
   RENDER — shared
   ========================================================================= */
function render(first){
  $('#vOverview').hidden = UI.view !== 'overview';
  $('#vMatrix').hidden = UI.view !== 'matrix';
  $('#vVillage').hidden = UI.view !== 'village';
  renderHeader(); renderNav();
  if (UI.view === 'overview') renderOverview();
  else if (UI.view === 'matrix') renderMatrix();
  else renderVillage(first);
  renderFoot();
  if (UI.pendingOpen) { const id = UI.pendingOpen; UI.pendingOpen = null; openPanel(id); }
}
function renderHeader(){
  const s = DATA.settings || {};
  const base = s.DASHBOARD_TITLE || 'Physical Possession of Private Land';
  if (UI.view === 'village') {
    const v = V.find(x => x.key === UI.vkey);
    $('#eyebrow').textContent = 'Village timeline · ' + v.name;
    $('#title').textContent = v.name + ' — ' + base;
    $('#subtitle').textContent = 'Responsible: ' + (v.person || 'not assigned') + ' · ' + (s.DASHBOARD_SUBTITLE || '');

    $('#eyebrow').textContent = UI.view === 'matrix' ? 'All villages · at a glance' : 'All villages · overview';
    $('#title').textContent = base;
    $('#subtitle').textContent = s.DASHBOARD_SUBTITLE || '';
    document.title = base;
  }
  $('#todayPill').textContent = 'Today · ' + fmtLong(TODAY);
}
function renderNav(){
  const ic = {

    grid: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>'
  };

    V.map(v => { const n = late(v.key); return `<a href="#/v/${encodeURIComponent(v.key)}" class="${UI.vkey === v.key ? 'on' : ''}" title="Responsible: ${esc(v.person)}">${esc(v.name)}${n ? `<span class="cnt" title="${n} overdue">${n}</span>` : ''}</a>`; }).join('');
  const on = $('#nav a.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });

function legendHTML(withMarks){
  const st = ORDER.map(k => chip(k)).join('');
  const mk = withMarks ? `<div class="grp">
      <span class="lg"><span class="mk scml"></span><b style="color:var(--scml)">SCML target</b></span>
      <span class="lg"><span class="mk ampl"></span><b style="color:var(--ampl)">AMPL target</b></span>
      <span class="lg"><span class="mk win"></span>gap between the two dates</span>
      <span class="lg"><span class="mk hatchsw"></span>${esc(AFTER_LABEL)}</span>
      <span class="lg"><span class="mk today"></span>Today</span></div><span class="div"></span>` : '';
  return `<div class="card legend">${mk}<div class="grp">${st}</div></div>`;
}
function segbar(c){
  const total = ORDER.reduce((s, k) => s + c[k], 0) || 1;
  return `<div class="segbar">${ORDER.filter(k => c[k]).map(k => `<span style="width:${c[k] / total * 100}%;background:${SCOLOR[k]}" title="${esc(ST[k].label)}: ${c[k]}"></span>`).join('')}</div>`;
}
function ring(pct, color){
  const r = 22, C = 2 * Math.PI * r;
  return `<div class="ring"><svg width="52" height="52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="#eef0f7" stroke-width="6"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C * pct / 100} ${C}"/></svg><b>${pct}%</b></div>`;
}
const pctDone = c => { const app = ORDER.reduce((s, k) => s + c[k], 0) - c.na; return app ? Math.round(c.done / app * 100) : 0; };
const applicable = c => ORDER.reduce((s, k) => s + c[k], 0) - c.na;

/* =========================================================================
   OVERVIEW
   ========================================================================= */
function renderOverview(){
  const c = counts(LINES);
  const app = applicable(c);
  const persons = personsOf();
  const tile = (k, label, val, sub, color, click) =>
    `<div class="card kpi ${click ? 'click' : ''}" style="--kc:${color}" ${click ? `data-tab="${click}"` : ''}><div class="k-l">${label}</div><div class="k-v">${val}</div><div class="k-s">${sub}</div></div>`;
  let h = `<div class="kpis">
    ${tile('v', 'Villages', V.length, persons.length + ' responsible persons', '#4f46e5')}
    ${tile('a', 'Activity lines', app, DATA.activities.length + ' activities · ' + c.na + ' NA excluded', '#7c3aed')}
    ${tile('d', 'Completed', c.done, (app ? Math.round(c.done / app * 100) : 0) + '% of applicable', SCOLOR.done)}
    ${tile('p', 'In progress', c.prog, 'started, no fixed date', SCOLOR.prog, 'prog')}
    ${tile('l', 'Overdue', c.late, 'SCML date passed', SCOLOR.late, 'late')}
    ${tile('r', 'AMPL target missed', c.risk, 'SCML date still ahead', SCOLOR.risk, 'risk')}
    ${tile('s', 'Due ≤ ' + DUE_DAYS + ' days', c.soon, 'a target date coming up', SCOLOR.soon, 'soon')}
    ${tile('f', esc(AFTER_LABEL), c.after, 'deferred', SCOLOR.after)}
  </div>`;

  h += `<div class="sec-title"><h2>Responsible persons and their villages</h2><p>Each card counts one line per activity (Kankarei: Phase I and Phase II separately). Click a card to open its Gantt.</p></div>`;
  persons.forEach(p => {
    const pl = LINES.filter(L => (L.v.person || 'Not assigned') === p.name), pc = counts(pl);
    h += `<div class="card person"><div class="p-head">
        <div class="avatar" style="background:${p.grad}">${esc(initials(p.name))}</div>
        <div><div class="p-name">${esc(p.name)}</div><div class="p-sub">${p.villages.map(v => esc(v.name)).join(' · ')}</div></div>
        <div class="p-chips">${pc.late ? chip('late', pc.late + ' overdue') : ''}${pc.risk ? chip('risk', pc.risk + ' AMPL missed') : ''}${pc.soon ? chip('soon', pc.soon + ' due ≤ ' + DUE_DAYS + 'd') : ''}${chip('done', pc.done + ' of ' + applicable(pc) + ' completed')}</div>
      </div><div class="vcards">${p.villages.map(villageCard).join('')}</div></div>`;
  });

  // Latest remarks across all villages
  const recent = [];
  LINES.forEach(L => L.rm.forEach(r => recent.push({ r, L })));
  recent.sort((a, b) => a.r.at < b.r.at ? 1 : a.r.at > b.r.at ? -1 : 0);
  h += `<div class="sec-title"><h2>Latest remarks</h2><p>${recent.length ? recent.length + ' remark' + (recent.length === 1 ? '' : 's') + ' in total. ' : ''}To add one, click any activity (here, in a village Gantt or in the at-a-glance grid) and use the Remarks box.</p></div>
    <div class="card recent">${recent.length ? recent.slice(0, 8).map(({ r, L }) =>
      `<div class="it" data-line="${esc(L.id)}"><div class="wh"><b>${esc(trackName(L.v, L.t))}</b> · ${esc(L.act.sl)}. ${esc(L.act.name)}</div><div class="by">${esc(r.by || '—')} · ${fmtAt(r.at)}</div><div class="tx">${esc(r.text)}</div></div>`).join('')
      : `<div class="empty">No remarks yet. Open any activity and write the first one — it is saved to the <b>Remarks</b> tab of the Google Sheet.</div>`}</div>`;

  // Action list
  const tabs = ['late', 'risk', 'soon', 'prog'];
  if (!UI.listTab || !tabs.includes(UI.listTab)) UI.listTab = tabs.find(k => c[k]) || 'soon';
  h += `<div class="sec-title" id="actionList"><h2>Action list</h2><p>Click a row to see the details and the same activity in every village.</p></div>
    <div class="card"><div class="tabs">${tabs.map(k => `<button class="${UI.listTab === k ? 'on' : ''}" data-tab="${k}" style="color:${SCOLOR[k]}">${esc(ST[k].label)} <b><span>${c[k]}</span></b></button>`).join('')}</div>
    <div class="tbl-wrap">${actionTable(LINES.filter(L => L.st === UI.listTab))}</div></div>`;
  h += legendHTML(false).replace('class="card legend"', 'class="card legend" style="margin-top:14px"');
  if (DATA.warnings && DATA.warnings.length) h += `<div class="warnbox"><b>Cells the dashboard could not read</b> (they are shown as plain text):<ul>${DATA.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
  $('#vOverview').innerHTML = h;

  $('#vOverview').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    UI.listTab = b.dataset.tab; renderOverview();
    if (b.classList.contains('kpi')) $('#actionList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  bindLineRows($('#vOverview'));
}
function villageCard(v){
  const vl = linesOf(v.key), c = counts(vl), app = applicable(c);
  const hasDates = vl.some(L => L.s.k !== 'blank' || L.a.k !== 'blank');
  const pct = pctDone(c);
  const phases = v.tracks.filter(t => t.phase).map(t => t.phase);
  // next upcoming target
  let nx = null;
  vl.forEach(L => { if (['done', 'na', 'prog'].includes(L.st)) return;
    [['SCML', L.s], ['AMPL', L.a]].forEach(([r, cc]) => { if (cc.k !== 'date') return; const n = dnum(cc.d); if (n >= TODAY && (!nx || n < nx.n)) nx = { n, r, L }; }); });
  const chips = ['late', 'risk', 'soon', 'prog', 'after'].filter(k => c[k]).map(k => chip(k, c[k] + ' ' + (k === 'after' ? AFTER_LABEL.replace(/^After\s*/i, 'after ') : ST[k].label.toLowerCase()))).join('');
  let body;
  if (!v.inTimeline || !hasDates) {
    body = `<div class="vc-empty">${v.inTimeline ? `No target dates entered yet. Fill columns <b>${esc(v.tracks.map(t => t.cols.scml + '–' + t.cols.ampl).join(', '))}</b> of the Timeline tab.` : 'Not in the Timeline tab yet — add its two columns (For SCML / For AMPL).'}</div>`;
  } else {
    const nRm = vl.reduce((s, L) => s + L.rm.length, 0);
    body = segbar(c) + `<div class="vc-chips">${chip('done', c.done + ' of ' + app + ' completed')}${chips}${nRm ? `<span class="chip rmc">${RM_ICON}${nRm} remark${nRm === 1 ? '' : 's'}</span>` : ''}</div>` +
      (phases.length > 1 ? v.tracks.map((t, ti) => { const tc = counts(linesOf(v.key, ti)); return `<div class="vc-phase"><span>${esc(t.phase)}</span><span>${tc.done}/${applicable(tc)} done${tc.late ? ' · <b style="color:var(--late)">' + tc.late + ' overdue</b>' : ''}</span></div>`; }).join('') : '') +
      `<div class="vc-next"><span class="lbl">Next target date</span>${nx ? `<b>${fmtD(nx.n)}</b> · <span class="chip tag-${nx.r.toLowerCase()}" style="padding:0 6px;font-size:10.5px">${nx.r}</span> ${rel(nx.n)}<br>${esc(nx.L.act.name)}${nx.L.t.phase ? ' <small>(' + esc(nx.L.t.phase) + ')</small>' : ''}` : 'No upcoming dated target'}</div>`;
  }
  return `<a class="vcard" href="#/v/${encodeURIComponent(v.key)}">
    <div class="vc-top"><div><div class="vc-name">${esc(v.name)}</div><div class="vc-sub">${phases.length ? esc(phases.join(' · ')) : esc(v.description || DATA.activities.length + ' activities')}</div></div>${hasDates ? ring(pct, v.color) : ''}</div>
    ${body}</a>`;
}
function dateCell(c){
  const st = cst(c);
  if (c.k === 'date') { const n = dnum(c.d); return `<td class="dcell" style="color:${st === 'late' ? 'var(--late)' : st === 'soon' ? 'var(--soon)' : 'inherit'}">${fmtD(n)}${c.n ? ' <small style="display:inline">· ' + esc(c.n) + '</small>' : ''}<small>${rel(n)}</small></td>`; }
  return `<td class="dcell" style="color:${st === 'done' ? 'var(--done)' : 'var(--ink-3)'};font-weight:600">${esc(cellText(c))}</td>`;
}
function actionTable(lines){
  if (!lines.length) return `<div class="empty">Nothing here right now. 🎉</div>`;
  lines = lines.slice().sort((a, b) => (nextDate(a) ?? 1e9) - (nextDate(b) ?? 1e9) || a.v.idx - b.v.idx || a.ai - b.ai);
  return `<table class="tbl"><thead><tr><th>#</th><th>Activity</th><th>Village</th><th style="color:var(--scml)">SCML target</th><th style="color:var(--ampl)">AMPL target</th><th>Responsible</th><th>Status</th></tr></thead><tbody>${
    lines.map(L => `<tr class="click" data-line="${esc(L.id)}"><td><b>${esc(L.act.sl)}</b></td><td style="min-width:240px;font-weight:600">${esc(L.act.name)}${L.rm.length ? `<div class="rm-snip">“${esc(L.rm[0].text)}” — ${esc(L.rm[0].by || 'remark')}, ${fmtAt(L.rm[0].at)}${L.rm.length > 1 ? ' (+' + (L.rm.length - 1) + ' more)' : ''}</div>` : ''}</td>
      <td style="white-space:nowrap"><b>${esc(L.v.name)}</b>${L.t.phase ? '<br><small style="color:var(--ink-3);font-weight:700">' + esc(L.t.phase) + '</small>' : ''}</td>
      ${dateCell(L.s)}${dateCell(L.a)}<td style="white-space:nowrap">${esc(L.v.person)}</td><td>${chip(L.st)}</td></tr>`).join('')}</tbody></table>`;
}
function bindLineRows(root){
  root.querySelectorAll('[data-line]').forEach(el => el.addEventListener('click', e => {
    e.preventDefault();
    const L = LINES.find(x => x.id === el.dataset.line); if (!L) return;
    if (UI.view === 'village' && UI.vkey === L.v.key) openPanel(L.id);
    else go('#/v/' + encodeURIComponent(L.v.key), L.id);
  }));
}

/* =========================================================================
   MATRIX — all villages at a glance (same layout as the Excel)
   ========================================================================= */
function renderMatrix(){
  const persons = personsOf();
  const vs = V.filter(v => !UI.mxPerson || v.person === UI.mxPerson);
  const roles = UI.mxRole === 'both' ? ['s', 'a'] : [UI.mxRole];
  const q = UI.mxQ.trim().toLowerCase();
  const acts = DATA.activities.map((a, i) => ({ a, i })).filter(x => !q || (x.a.sl + ' ' + x.a.name).toLowerCase().includes(q));
  const anyPhase = vs.some(v => v.tracks.some(t => t.phase));

  let r1 = `<th class="stk" rowspan="${anyPhase ? 3 : 2}" style="text-align:left;vertical-align:bottom;padding:10px">Activity</th>`, r2 = '', r3 = '';
  vs.forEach(v => {
    const span = Math.max(1, v.tracks.length) * roles.length;
    r1 += `<th class="vh vs" colspan="${span}" style="background:${v.color}"><a href="#/v/${encodeURIComponent(v.key)}">${esc(v.name)}<small>${esc(v.person || '—')}</small></a></th>`;
    (v.tracks.length ? v.tracks : [{ phase: '' }]).forEach((t, ti) => {
      if (anyPhase) r2 += `<th class="ph ${ti === 0 ? 'vs' : ''}" colspan="${roles.length}">${esc(t.phase || '')}</th>`;
      roles.forEach((r, ri) => r3 += `<th class="${r === 's' ? 'rs' : 'ra'} ${ti === 0 && ri === 0 ? 'vs' : ''}">${r === 's' ? 'SCML' : 'AMPL'}</th>`);
    });
  });
  const head = anyPhase ? `<tr>${r1}</tr><tr>${r2}</tr><tr>${r3}</tr>` : `<tr>${r1}</tr><tr>${r3}</tr>`;

  const body = acts.map(({ a, i }) => `<tr><td class="an stk"><span class="sl">${esc(a.sl)}</span>${esc(a.name)}</td>${
    vs.map(v => (v.tracks.length ? v.tracks : [null]).map((t, ti) => roles.map((r, ri) => {
      if (!t) return `<td class="c ${ri === 0 ? 'vs' : ''}"><span class="d-none">—</span></td>`;

      return `<td class="c ${ti === 0 && ri === 0 ? 'vs' : ''} ${UI.flash.has(id) ? 'flash' : ''} ${nrm ? 'has-rm' : ''}" data-line="${esc(id)}" data-tip="${esc(id)}" data-role="${r}"><span class="d-${st}">${esc(txt)}</span></td>`;
    }).join('')).join('')).join('')}</tr>`).join('');

  $('#vMatrix').innerHTML = `
    <div class="toolbar">

      <div class="ctl"><label class="lbl">Show</label><div class="seg" id="mxRole">${[['both', 'SCML + AMPL'], ['s', 'SCML only'], ['a', 'AMPL only']].map(([k, l]) => `<button data-k="${k}" class="${UI.mxRole === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <div class="ctl"><label class="lbl">Responsible</label><div class="seg" id="mxPerson"><button data-k="" class="${!UI.mxPerson ? 'on' : ''}">All</button>${persons.map(p => `<button data-k="${esc(p.name)}" class="${UI.mxPerson === p.name ? 'on' : ''}">${esc(p.name)}</button>`).join('')}</div></div>
    </div>
    ${legendHTML(false)}
    <div class="card" style="margin-top:12px;overflow:hidden"><div class="mx-wrap"><table class="mx"><thead>${head}</thead><tbody>${body || `<tr><td class="an stk">No activity matches “${esc(UI.mxQ)}”.</td></tr>`}</tbody></table></div></div>
    <p style="font-size:12px;color:var(--ink-3);margin:8px 2px">Colours follow each date: red = passed, amber = within ${DUE_DAYS} days, green = completed, violet = ${esc(AFTER_LABEL)}. * = date with a note (hover). <span style="color:#db2777">●</span> = has remarks. Click any cell to open it in its village Gantt.</p>`;

  const inp = $('#mxQ');
  inp.oninput = () => { UI.mxQ = inp.value; const pos = inp.selectionStart; renderMatrix(); const n = $('#mxQ'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#mxRole').querySelectorAll('button').forEach(b => b.onclick = () => { UI.mxRole = b.dataset.k; renderMatrix(); });
  $('#mxPerson').querySelectorAll('button').forEach(b => b.onclick = () => { UI.mxPerson = b.dataset.k; renderMatrix(); });
  bindLineRows($('#vMatrix'));
  bindTips($('#vMatrix'));
}

/* =========================================================================

let G = null;   // current gantt geometry
function renderVillage(first){

    </div>

      <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="vq" placeholder="Find an activity…" value="${esc(UI.q)}"></div>
      <label class="toggle"><input type="checkbox" id="showNA" ${UI.showNA ? 'checked' : ''}> Show NA rows (${c.na})</label>

      <div class="ctl"><label class="lbl">Zoom</label><div class="seg" id="zoomSeg">${[['fit', 'Fit'], ['week', 'Weeks'], ['month', 'Months']].map(([k, l]) => `<button data-k="${k}" class="${UI.zoom === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>

  const ps = $('#phaseSeg'); if (ps) ps.querySelectorAll('button').forEach(b => b.onclick = () => { UI.phase = b.dataset.k === 'all' ? 'all' : Number(b.dataset.k); renderVillage(); });
  $('#markSeg').querySelectorAll('button').forEach(b => b.onclick = () => { UI.marks = b.dataset.k; $('#markSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderGantt(v); });
  $('#zoomSeg').querySelectorAll('button').forEach(b => b.onclick = () => { UI.zoom = b.dataset.k; $('#zoomSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderGantt(v, { scrollToday: true }); });

function visibleLines(v){
  const q = UI.q.trim().toLowerCase();
  return linesOf(v.key, UI.phase).filter(L => {
    if (L.st === 'na' && !UI.showNA && !UI.statuses.has('na')) return false;
    if (UI.statuses.size && !UI.statuses.has(L.st)) return false;
    if (UI.onlyRm && !L.rm.length) return false;
    if (q && !(L.act.sl + ' ' + L.act.name).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => a.ai - b.ai || a.ti - b.ti);
}

function renderGantt(v, opt = {}){
  const box = $('#gantt'); if (!box) return;
  const keepLeft = box.scrollLeft, keepTop = box.scrollTop;
  const all = linesOf(v.key);
  const noDates0 = !all.some(L => L.s.k !== 'blank' || L.a.k !== 'blank');
  const rows = noDates0 ? [] : visibleLines(v);
  const multi = v.tracks.length > 1 && UI.phase === 'all';
  const showS = UI.marks !== 'a', showA = UI.marks !== 's';

  // ---- time domain (fixed for the whole village so the axis doesn't jump while filtering)
  const ds = [TODAY];
  let afterMax = null;
  all.forEach(L => [L.s, L.a].forEach(c => { if (c.k === 'date') ds.push(dnum(c.d)); if (c.k === 'after' && c.d) { const n = dnum(c.d); ds.push(n); afterMax = Math.max(afterMax || n, n); } }));
  let lo = Math.min(...ds) - 5, hi = Math.max(...ds) + 12;
  if (afterMax != null) hi = Math.max(hi, afterMax + 45);
  if (ds.length === 1) hi = TODAY + 120;
  const loD = dobj(lo); lo = Math.round(Date.UTC(loD.getUTCFullYear(), loD.getUTCMonth(), 1) / DAY);
  const hiD = dobj(hi); hi = Math.round(Date.UTC(hiD.getUTCFullYear(), hiD.getUTCMonth() + 1, 1) / DAY);
  const days = hi - lo;
  const leftW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--left')) || 520;
  const avail = Math.max(200, box.clientWidth - leftW - 2);
  const ppd = UI.zoom === 'week' ? 9 : UI.zoom === 'month' ? 3.2 : Math.max(2.4, avail / days);
  const W = Math.round(days * ppd);
  const x = n => (n - lo) * ppd;
  G = { lo, hi, ppd, W, x, leftW };

  // ---- header scale
  let scale = '', overlay = '';
  for (let m = lo, k = 0; m < hi; k++) {
    const d = dobj(m), nx = Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / DAY);
    const w = (nx - m) * ppd;
    scale += `<div class="g-month ${k % 2 ? 'alt' : ''}" style="left:${x(m)}px;width:${w}px">${w > 70 ? MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear() : w > 34 ? MON[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear()).slice(2) : MON[d.getUTCMonth()][0]}</div>`;
    overlay += `<div class="g-vl m" style="left:${x(m)}px"></div>`;
    m = nx;
  }
  const step = ppd >= 6 ? 7 : ppd >= 3 ? 14 : 0;
  if (step) {
    // Mondays (weekly) or 1st/15th (fortnightly)
    for (let n = lo; n < hi; n++) {
      const d = dobj(n), dd = d.getUTCDate();
      const tick = step === 7 ? d.getUTCDay() === 1 : (dd === 15);
      if (!tick) continue;
      scale += `<div class="g-tick" style="left:${x(n)}px">${dd}</div>`;
      overlay += `<div class="g-vl" style="left:${x(n)}px"></div>`;
    }
  }
  if (TODAY >= lo && TODAY <= hi) {
    scale += `<div class="g-today-lbl" style="left:${x(TODAY) + ppd / 2}px">Today ${fmtShort(TODAY)}</div>`;
    overlay += `<div class="g-todayline" style="left:${x(TODAY) + ppd / 2 - 1}px"></div>`;
  }

  // ---- rows
  const rowH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row')) || 56;
  let html = '', prevAi = null;
  rows.forEach(L => {
    const firstOfAct = multi && prevAi !== null && prevAi !== L.ai; prevAi = L.ai;
    html += `<div class="g-row ${L.st === 'na' ? 'na' : ''} ${firstOfAct ? 'first-of-act' : ''} ${UI.sel === L.id ? 'sel' : ''} ${UI.flash.has(L.id) ? 'flash' : ''}" style="--rc:${SCOLOR[L.st]}" data-line="${esc(L.id)}" data-tip="${esc(L.id)}">
      <div class="g-left"><div class="sl">${esc(L.act.sl)}</div>
        <div class="nm"><div class="t" title="${esc(L.act.name)}">${esc(L.act.name)}</div><div class="m">${chip(L.st)}${multi ? `<span class="chip" style="background:#f5f3ff;color:#5b21b6">${esc(L.t.phase)}</span>` : ''}${L.rm.length ? `<span class="chip rmc" title="${esc(L.rm[0].text)}">${RM_ICON}${L.rm.length}</span>` : ''}</div></div>
        ${dtCell(L.s, 'SCML')}${dtCell(L.a, 'AMPL')}</div>
      <div class="g-track" style="width:${W}px">${trackShapes(L, showS, showA)}</div></div>`;
  });

  const noDates = !all.some(L => L.s.k !== 'blank' || L.a.k !== 'blank');
  const empty = noDates
    ? `<div class="g-empty"><b>No target dates entered yet for ${esc(v.name)}.</b><br>Fill ${v.tracks.length ? `columns <b>${esc(v.tracks.map(t => t.cols.scml + ' (SCML) and ' + t.cols.ampl + ' (AMPL)').join(', '))}</b>` : 'its two columns'} of the <b>Timeline</b> tab — the Gantt appears automatically.</div>`
    : !rows.length ? `<div class="g-empty">No activity matches the current filter.</div>` : '';

  box.innerHTML = `<div class="g-inner" style="width:${leftW + W}px">
    <div class="g-head"><div class="g-left"><div>#</div><div>Activity · status</div><div class="hd" style="color:var(--scml)">◆ SCML</div><div class="hd" style="color:var(--ampl)">● AMPL</div></div>
      <div class="g-scale" style="width:${W}px">${scale}</div></div>
    <div class="g-overlay" style="left:${leftW}px;width:${W}px;height:${Math.max(rows.length, noDates || !rows.length ? 4 : 0) * rowH}px">${overlay}</div>
    ${html}${empty}${(noDates || !rows.length) ? `<div style="height:${4 * rowH}px"></div>` : ''}</div>`;

  bindLineRows(box); bindTips(box);
  if (opt.scrollToday) requestAnimationFrame(() => scrollToToday(false));
  else { box.scrollLeft = keepLeft; box.scrollTop = keepTop; }
}
function scrollToToday(smooth){
  const box = $('#gantt'); if (!box || !G) return;
  const target = Math.max(0, G.x(TODAY) - 140);
  box.scrollTo({ left: target, behavior: smooth ? 'smooth' : 'auto' });
}
function dtCell(c, role){
  const st = cst(c);
  if (c.k === 'date') { const n = dnum(c.d); return `<div class="dt ${st}">${fmtD(n)}<small>${esc(c.n || rel(n))}</small></div>`; }
  const txt = { done: '✓ Completed', na: 'NA', after: (c.t || AFTER_LABEL).replace(/^After\s*/i, 'After '), progress: 'In process', blank: 'Not fixed', text: c.t }[c.k] || c.t;
  return `<div class="dt ${st === 'note' ? '' : st}">${esc(txt)}${c.k === 'progress' ? '<small>started</small>' : ''}</div>`;
}
/** Bars, markers and labels inside one Gantt row. */
function trackShapes(L, showS, showA){
  const { x, W, ppd } = G;
  const half = ppd / 2;
  const items = [];
  if (showS) items.push({ r: 's', c: L.s }); if (showA) items.push({ r: 'a', c: L.a });
  const pts = [], afters = [], parts = [];
  items.forEach(({ r, c }) => {
    const name = r === 's' ? 'SCML' : 'AMPL';
    if (c.k === 'date') { const n = dnum(c.d); pts.push({ r, n, px: x(n) + half, late: n < TODAY }); parts.push({ n, h: `<span class="p ${r}"><b>${name}</b> ${fmtShort(n)}${c.n ? ' (' + esc(c.n) + ')' : ''}</span>` }); return; }
    else if (c.k === 'after') { afters.push({ r, px: c.d ? x(dnum(c.d)) : W - 160, c }); }
    else if (c.k === 'done') parts.push(`<span class="p ${r}"><b>${name}</b> <span style="color:var(--done)">✓ Completed</span></span>`);
    else if (c.k === 'progress') parts.push(`<span class="p ${r}"><b>${name}</b> <span style="color:var(--prog)">in process</span></span>`);
    else if (c.k === 'na') parts.push(`<span class="p ${r}"><b>${name}</b> NA</span>`);
    else if (c.k === 'blank') parts.push(`<span class="p ${r}"><b>${name}</b> <span style="color:var(--ink-3)">not fixed</span></span>`);
    else parts.push(`<span class="p ${r}"><b>${name}</b> ${esc(c.t)}</span>`);
  });
  // order labels by date; if SCML and AMPL say the same thing, say it once
  let partsH = parts.map(p => typeof p === 'string' ? { n: 1e9, h: p } : p).sort((m, n) => m.n - n.n).map(p => p.h);
  if (showS && showA && L.s.k === L.a.k && ['done', 'na', 'progress', 'blank'].includes(L.s.k)) {
    partsH = [`<span class="p"><b style="color:var(--ink)">SCML &amp; AMPL</b> ${{ done: '<span style="color:var(--done)">✓ Completed</span>', na: 'not applicable', progress: '<span style="color:var(--prog)">started · in process</span>', blank: '<span style="color:var(--ink-3)">target date not fixed yet</span>' }[L.s.k]}</span>`];
  }
  let h = '';
  const col = SCOLOR[L.st];
  // window between the two dates
  if (pts.length === 2 && Math.abs(pts[0].px - pts[1].px) > 1) {
    const [p0, p1] = pts.slice().sort((m, n) => m.px - n.px);
    const cv = r => r === 'a' ? 'var(--ampl)' : 'var(--scml)';
    h += `<div class="bar" style="left:${p0.px}px;width:${p1.px - p0.px}px;background:linear-gradient(90deg,${cv(p0.r)},${cv(p1.r)})"></div>`;
  }
  // date → deferred: dashed link
  if (pts.length === 1 && afters.length === 1 && afters[0].px > pts[0].px) {
    h += `<div class="bar dash" style="--bc:${col};left:${pts[0].px}px;width:${afters[0].px - pts[0].px}px"></div>`;
  }
  // deferred block(s)
  if (afters.length) {
    const ax = Math.min(...afters.map(a => a.px));
    const who = afters.length === 2 ? 'SCML + AMPL' : afters[0].r === 's' ? 'SCML' : 'AMPL';
    h += `<div class="hatch" style="left:${ax}px;width:${Math.max(60, W - ax - 6)}px">${who} → ${esc(afters[0].c.t || AFTER_LABEL)}</div>`;
  }
  // in-process with no date
  if (!pts.length && !afters.length && L.st === 'prog') {
    const tx = x(TODAY) + half, st = Math.max(4, tx - 26 * ppd);
    h += `<div class="progbar" style="left:${st}px;width:${tx - st}px"></div>`;
  }
  pts.forEach(p => h += `<div class="mark ${p.r === 's' ? 'scml' : 'ampl'}" style="left:${p.px}px" title="${p.r === 's' ? 'SCML' : 'AMPL'} target ${fmtD(p.n)}"></div>`);

  // label
  if (partsH.length) {
    const xs = pts.map(p => p.px);
    let lx, anchorRight = false;
    if (xs.length) lx = Math.max(...xs) + 14;
    else if (L.st === 'prog') lx = x(TODAY) + half + 10;
    else lx = 10;
    const estW = partsH.join(' ').replace(/<[^>]+>/g, '').length * 6.3 + 20;
    const limit = afters.length ? Math.min(...afters.map(a => a.px)) - 6 : W - 6;
    if (xs.length && lx + estW > limit) { anchorRight = true; lx = Math.min(...xs) - 14; }
    h += `<div class="glabel" style="${anchorRight ? `right:${W - lx}px` : `left:${lx}px`}">${partsH.join('')}</div>`;
  }
  return h;
}

/* =========================================================================
   TOOLTIP
   ========================================================================= */
function tipHTML(L){
  const line = (k, c) => {
    let t = cellText(c, false), r = '';
    if (c.k === 'date') r = rel(dnum(c.d));
    return `<div class="tr"><span class="k" style="color:${k === 'SCML' ? '#f9a8d4' : '#7dd3fc'}">${k}</span><span>${esc(t)}${r ? ' · <b>' + r + '</b>' : ''}</span></div>`;
  };
  return `<div class="tt">${esc(L.act.sl)}. ${esc(L.act.name)}</div>
    <div style="opacity:.8;margin-bottom:4px">${esc(trackName(L.v, L.t))} · ${esc(L.v.person || '—')}</div>
    ${line('SCML', L.s)}${line('AMPL', L.a)}
    <div style="margin-top:7px">${chip(L.st)}</div>
    ${L.rm.length ? `<div class="trm"><b>Latest remark</b> (${L.rm.length}) · ${esc(L.rm[0].by || '—')}, ${fmtAt(L.rm[0].at)}<br>${esc(L.rm[0].text.length > 220 ? L.rm[0].text.slice(0, 220) + '…' : L.rm[0].text)}</div>` : ''}`;
}
function bindTips(root){
  const tip = $('#tip');
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', () => { const L = LINES.find(x => x.id === el.dataset.tip); if (!L || matchMedia('(hover:none)').matches) return; tip.innerHTML = tipHTML(L); tip.classList.add('show'); });
    el.addEventListener('mousemove', e => {
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let lx = e.clientX + 16, ly = e.clientY + 16;
      if (lx + w > innerWidth - 8) lx = e.clientX - w - 16;
      if (ly + h > innerHeight - 8) ly = e.clientY - h - 16;
      tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
    });
    el.addEventListener('mouseleave', hideTip);
  });
}
function hideTip(){ $('#tip').classList.remove('show'); }

/* =========================================================================
   DETAIL PANEL
   ========================================================================= */
function openPanel(id){
  const L = LINES.find(x => x.id === id); if (!L) return;
  // keep whatever is being typed if the panel is re-drawn by a live update
  const ta = $('#rmText'), hadFocus = ta && document.activeElement === ta;
  if (ta && UI.sel) UI.drafts[UI.sel] = ta.value;
  UI.sel = id; hideTip();
  document.querySelectorAll('.g-row.sel').forEach(r => r.classList.remove('sel'));
  const row = document.querySelector(`.g-row[data-line="${CSS.escape(id)}"]`);
  if (row) { row.classList.add('sel'); row.scrollIntoView({ block: 'nearest' }); }

  const box = (r, c) => {

/* =========================================================================
   SYNC — polls ?action=version, downloads ?action=data only when it changes.
   Falls back to JSONP automatically if the browser blocks the fetch.
   ========================================================================= */
const API = new URLSearchParams(location.search).get('api') || CONFIG.API_URL;
let useJsonp = false, jsonpN = 0, pollTimer = null, failCount = 0, usingDemo = false;

function apiUrl(action, params = {}){
  let u = API + (API.includes('?') ? '&' : '?') + 'action=' + action;
  Object.entries(params).forEach(([k, v]) => { u += '&' + k + '=' + encodeURIComponent(v); });
  return u + '&_=' + Date.now();
}
function jsonp(url){
  return new Promise((res, rej) => { const cb = '__rr' + (++jsonpN); const s = document.createElement('script'); let done = false;
    const t = setTimeout(() => { if (!done) { cleanup(); rej(new Error('JSONP timeout')); } }, 20000);
    const cleanup = () => { done = true; clearTimeout(t); delete window[cb]; s.remove(); };
    window[cb] = d => { cleanup(); res(d); }; s.onerror = () => { cleanup(); rej(new Error('Network error')); };
    s.src = url + '&callback=' + cb; document.head.appendChild(s); });
}
async function apiGet(action, params){
  const url = apiUrl(action, params);
  let j;
  if (!useJsonp) {
    try { const r = await fetch(url, { cache: 'no-store', redirect: 'follow' }); if (!r.ok) throw new Error('HTTP ' + r.status); j = await r.json(); }
    catch (e) { if (!(e instanceof TypeError) && !(e instanceof SyntaxError)) throw e; j = await jsonp(url); useJsonp = true; }
  } else j = await jsonp(url);
  if (!j || j.ok === false) throw new Error(j && j.error ? j.error : 'Bad response');
  return j;
}
function setSync(state, text){
  syncState = state;
  $('#syncDot').className = 'dot' + (state === 'live' ? '' : state === 'demo' ? ' demo' : state === 'error' ? ' err' : ' warn');
  if (text) $('#syncText').textContent = text;
}
function timeAgo(t){ const s = Math.round((Date.now() - t) / 1000); if (s < 5) return 'just now'; if (s < 60) return s + 's ago'; const m = Math.round(s / 60); if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); return h < 24 ? h + ' h ago' : Math.round(h / 24) + ' d ago'; }
const clock = d => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function tickClock(){
  if (syncState === 'live' && LAST_SYNC) $('#syncText').textContent = `Live · checked ${clock(LAST_SYNC)}`;
  const cp = $('#changedPill');

/** Takes a payload, rebuilds the model, re-renders and highlights what changed. */
function ingest(d, isDemo){
  if (!d || !Array.isArray(d.villages) || !Array.isArray(d.activities)) throw new Error('This web app is still running the old Code.gs — deploy the new version (Manage deployments ▸ Edit ▸ New version).');
  const first = !DATA;
  const prev = SIG;
  DATA = d; VERSION = d.version; usingDemo = !!isDemo;
  if (d.changedAt) CHANGED_AT = new Date(d.changedAt);
  buildModel(d);
  SIG = new Map(LINES.map(L => [L.id, sigOf(L)]));
  UI.flash = new Set();
  if (!first && !isDemo) {
    LINES.forEach(L => { if (prev.has(L.id) && prev.get(L.id) !== SIG.get(L.id)) UI.flash.add(L.id); });
  }
  if (first) route();
  else {
    if (UI.view === 'village' && !V.some(v => v.key === UI.vkey)) { location.hash = '#/'; return; }
    const sel = UI.sel;
    render(false);
    if (sel && LINES.some(L => L.id === sel)) openPanel(sel);
  }
  if (UI.flash.size) {
    const byV = {};
    UI.flash.forEach(id => { const n = id.split('|')[0]; byV[n] = (byV[n] || 0) + 1; });
    toast('Updated from the sheet — ' + Object.entries(byV).map(([k, n]) => (V.find(v => v.key === k) || {}).name + ' (' + n + ')').join(', '));
    setTimeout(() => { UI.flash.clear(); }, 2600);
  }
}

    ? `Could not load live data (<b>${esc(reason)}</b>). Showing the built-in snapshot of the Excel — retrying in the background. Check the web-app URL and that access is <b>Anyone</b>.`
    : `Showing the built-in snapshot of <b>Physical Possession of Pvt. Land – All village Timeline at a glance.xlsx</b>. Paste your Apps Script web-app URL into <code>CONFIG.API_URL</code> to go live.`;

async function poll(){
  clearTimeout(pollTimer);

  if (document.hidden) return schedule();

  } catch (e) { failCount++; setSync(failCount > 2 ? 'error' : 'warn', failCount > 2 ? 'Offline — retrying…' : 'Reconnecting…'); }
